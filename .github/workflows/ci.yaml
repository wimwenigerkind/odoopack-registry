name: CI

on:
  push:
    branches:
      - main
    # A release is a tag vX.Y.Z and nothing else; see RELEASING.md.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  # Every integration test migrates a schema of its own, so the packages may
  # run in parallel against the one database.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: odoopack
          POSTGRES_PASSWORD: odoopack
          POSTGRES_DB: odoopack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoopack -d odoopack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: host=localhost port=5432 user=odoopack password=odoopack dbname=odoopack_test sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go test -race -tags integration ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - run: helm lint charts/odoopack

      - run: helm template charts/odoopack

      # Checked before any image is built, so a release whose chart version
      # was not bumped stops here instead of after pushing its images.
      - name: Check chart version is unpublished
        if: ${{ env.RELEASE == 'true' }}
        run: .github/scripts/check-chart-unpublished.sh charts/odoopack "$CHART_REPOSITORY"

  build-push-backend:
    name: Build and Push Backend
    needs: [test, integration, lint, frontend, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ env.PUSH == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest follows releases only (flavor latest=auto adds it to semver
      # tags), so it never points at an untagged main build. A 0 tag would
      # span breaking 0.y releases, so major is left out below 1.0.0.
      # {{branch}} is empty outside a branch ref, so the sha tag would start
      # with a dash and be rejected; images that are not pushed need no sha tag.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix={{branch}}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./backend.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-push-frontend:
    name: Build and Push Frontend
    needs: [test, integration, lint, frontend, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ env.PUSH == 'true' }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix={{branch}}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./frontend.Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Builds both images locally, without pushing, so pull requests are scanned
  # too. Grype through anchore/scan-action: maintained by Anchore, needs no
  # registry or token, and fails on a severity cutoff limited to fixable findings.
  scan:
    name: Scan ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./${{ matrix.image }}.Dockerfile
          load: true
          tags: odoopack-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Scan
        uses: anchore/scan-action@v7.4.2
        with:
          image: odoopack-${{ matrix.image }}:scan
          severity-cutoff: high
          only-fixed: true
          output-format: table

  # Runs after both images are pushed, so the chart never points at a version
  # whose images do not exist yet. The chart version stays the one in
  # Chart.yaml; appVersion, the default image tag, becomes the release.
  release:
    name: Release
    needs: [build-push-backend, build-push-frontend]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Checked again right before the push: the registry may have changed
      # since the Helm job, and a push would overwrite the version silently.
      - name: Check chart version is unpublished
        run: .github/scripts/check-chart-unpublished.sh charts/odoopack "$CHART_REPOSITORY"

      - name: Package chart
        run: helm package charts/odoopack --app-version "${GITHUB_REF_NAME#v}" --destination dist

      - name: Push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/odoopack-*.tgz "$CHART_REPOSITORY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
