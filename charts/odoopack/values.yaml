# Default values for odoopack.

nameOverride: ""
fullnameOverride: ""

# Backend image, shared by the web and worker workloads and the migrate init container.
image:
  registry: ghcr.io
  repository: wimwenigerkind/odoopack-registry-backend
  # Pin to a main-<sha> tag for reproducible deploys.
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podSecurityContext: {}

securityContext: {}

# HTTP API server.
web:
  replicaCount: 1
  port: 6969
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 6969
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# Background worker that clones repos and builds zipballs.
worker:
  replicaCount: 1
  healthPort: 6970
  # A stopping worker finishes the job in hand, which runs for at most 10
  # minutes; keep this above that so the job is not killed halfway.
  terminationGracePeriodSeconds: 720
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# Static frontend served by nginx.
frontend:
  enabled: true
  image:
    registry: ghcr.io
    repository: wimwenigerkind/odoopack-registry-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  port: 80
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 80

# Database migrations run in the init container "migrate" of every web pod,
# before the web container starts. Concurrent runs serialize on a Postgres
# advisory lock, so the first pod migrates and the others find nothing to do.
# Disable only when you run the migrate binary yourself before each upgrade.
migration:
  enabled: true
  resources: {}

# Non-secret application config, rendered to config.yaml and read by viper.
config:
  base_url: "http://localhost"
  instance:
    mode: public
  cors:
    allowed_origins: []
  storage:
    driver: s3
    s3:
      endpoint: ""
      region: us-east-1
      bucket: ""
      access_key_id: ""
      use_ssl: true
      use_path_style: false
      prefix: ""
      presign_ttl: 5m
  # The web pods refuse the memory store unless dev_mode is true; redis needs
  # REDIS_URL in secrets or existingSecret.
  session:
    store: redis
  # auth.cookie_secure follows the scheme of base_url unless set explicitly.
  log:
    level: info

# Deep-merged over config above; use for auth providers and overrides.
extraConfig: {}

# Secret env vars (DATABASE_DSN, STORAGE_S3_SECRET_ACCESS_KEY, REDIS_URL,
# AUTH_<PROVIDER>_CLIENT_SECRET, INTEGRATIONS_ENCRYPTION_KEY). Rendered into a
# Secret unless existingSecret is set. INTEGRATIONS_ENCRYPTION_KEY is required
# once a provider sets allow_git_integration; generate it once with
# `openssl rand -base64 32` and keep it, see the README.
secrets: {}
existingSecret: ""

extraEnv: []
extraEnvFrom: []

# Path-based ingress: backendPaths route to the web service, everything else to the frontend.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
  backendPaths:
    - /api
    - /registry
    - /auth
    - /integrations
    - /webhooks
    - /healthz
    - /readyz
