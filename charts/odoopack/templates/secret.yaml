{{- if and (not .Values.existingSecret) (gt (len .Values.secrets) 0) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odoopack.fullname" . }}-env
  labels:
    {{- include "odoopack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
