{{- if .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "odoopack.fullname" . }}-web
  labels:
    {{- include "odoopack.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  minAvailable: {{ .Values.web.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "odoopack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
{{- end }}
{{- if .Values.worker.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "odoopack.fullname" . }}-worker
  labels:
    {{- include "odoopack.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "odoopack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
