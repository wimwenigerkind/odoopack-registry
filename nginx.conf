# One Cache-Control value per response, chosen here so that no location needs
# its own add_header: a location with any add_header drops every add_header of
# the server block, and the security headers below would silently vanish.
# The status is part of the key so that a 404 is never cached as immutable.
map "$status $uri" $cache_control {
    ~^\d+\ /api/                 "no-store";
    ~^(200|304)\ /index\.html$   "no-cache";
    ~^(200|304)\ /assets/        "public, max-age=31536000, immutable";
    ~^(200|304)\                 "public, max-age=3600";
    default                      "no-store";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # style-src needs 'unsafe-inline' because sonner and react-remove-scroll
    # (used by the Radix dialogs) inject <style> elements at runtime.
    # img-src allows any https origin for Gravatar and for images that addon
    # READMEs embed from anywhere (badges, screenshots); the README HTML is
    # sanitized by the backend.
    # font-src needs data: because Vite inlines the smallest font subsets.
    # connect-src assumes the api on the same origin; a build with
    # VITE_BACKEND_BASE_URL pointing elsewhere has to add that origin here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Browsers honour this only when it arrives over https, i.e. from the ingress.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cache-Control $cache_control always;

    location ^~ /api/ {
        return 404;
    }

    # Hashed build output: a missing file is a stale reference, not an app
    # route, so it must not fall back to index.html.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
